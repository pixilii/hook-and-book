<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19151e"><title>Hook &amp; Book</title><style>
*{box-sizing:border-box}body{margin:0;background:#19151e;color:#faf3ff;font:600 18px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:36px;margin:0;color:#e5c5fa}h2{font-size:25px}button,input,select{font:inherit;color:inherit;border:1px solid #9b84aa;border-radius:12px;padding:12px;background:#332a3e}button{cursor:pointer;background:#574167}button:disabled{opacity:.5;cursor:not-allowed}input{min-width:0;width:100%}label{display:block;margin:12px 0 5px}p{margin:10px 0}section,article{background:#27212e;border:1px solid #594962;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.grow{flex:1 1 200px!important}.muted{color:#d4c5df}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.grid article{margin:0;overflow:hidden}.cover{width:100%;aspect-ratio:3/4;object-fit:contain;background:#3a3045;border-radius:10px;display:block}.placeholder{display:grid;place-items:center;font-size:48px}.list{display:block}.list article{display:flex;align-items:center;gap:15px;margin:10px 0}.list .cover{width:80px;flex:none}.list .details{flex:1}h3{font-size:20px;overflow-wrap:anywhere;margin:10px 0}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}[hidden]{display:none!important}#status{white-space:pre-wrap;overflow-wrap:anywhere}dialog{width:min(96vw,1000px);height:90vh;background:#27212e;color:inherit;border:1px solid #9b84aa;border-radius:14px}iframe{width:100%;height:calc(100% - 75px);border:0}a{color:#e6c4ff} @media(max-width:500px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid article{padding:10px}h1{font-size:30px}}
</style><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://apis.google.com/js/api.js" async defer></script></head><body><main><h1>🧶 Hook &amp; Book</h1><p class="muted">Private crochet library · test version 0.1</p><section><label for="cid">Google Client ID</label><input id="cid" placeholder="…apps.googleusercontent.com" autocomplete="off"><label for="key">Google Picker API key</label><input id="key" placeholder="Browser API key" autocomplete="off"><div class="row" style="margin-top:12px"><button id="login">Connect Google Drive</button><button id="pick" disabled>Select test folder</button><button id="logout" disabled>Disconnect</button></div><p id="status" role="status" aria-live="polite">Connect to begin. No patterns are stored on this website.</p></section><section id="tools" hidden><h2>Add patterns</h2><label for="files">Choose PDF files</label><input type="file" id="files" multiple accept="application/pdf,.pdf"><label for="cat">Categories (optional, comma separated)</label><input id="cat" placeholder="Amigurumi, Turtles"><button id="upload" style="margin-top:12px">Upload selected PDFs</button></section><section id="library" hidden><div class="row"><h2 class="grow">Your library</h2><button id="refresh">Refresh</button><button id="view">List view</button></div><input id="search" placeholder="Search names or categories…" aria-label="Search"><p id="count" class="muted"></p><div id="cards" class="grid"></div></section></main><dialog id="reader"><div class="row"><button id="close">Close</button><button id="download">Download PDF</button><button id="share">Share PDF</button></div><p id="readstatus"></p><iframe id="frame" title="PDF reader"></iframe></dialog><script type="module">
const $=id=>document.getElementById(id), folder='1y4b8qb9VciFwSB_sgvTf5dd0y5Ms5bqR', scope='https://www.googleapis.com/auth/drive.file', base='https://www.googleapis.com/drive/v3/files';let token='',client,items=[],selected=false,busy=false,urls=[],active=null,activeUrl='';const msg=t=>$('status').textContent=t; const err=e=>msg(e.message||String(e)); const ready=()=>{ $('pick').disabled=!token||busy;$('logout').disabled=!token||busy;$('tools').hidden=!selected;$('library').hidden=!selected;$('upload').disabled=busy;$('refresh').disabled=busy;};
$('cid').value=localStorage.getItem('hb.cid')||'';$('key').value=localStorage.getItem('hb.key')||'';
async function api(url,opts={}){if(!token)throw Error('Connect Google Drive first.');const r=await fetch(url,{...opts,headers:{...opts.headers,Authorization:'Bearer '+token}});if(!r.ok){let s=await r.text();try{s=JSON.parse(s).error.message}catch{}if(r.status===401){token='';selected=false;ready();throw Error('Session expired. Connect again.')}throw Error('Google Drive: '+s)}return r;}
$('login').onclick=()=>{try{const id=$('cid').value.trim(),key=$('key').value.trim();if(!id||!key)throw Error('Enter the Client ID and Picker API key first.');if(!window.google?.accounts?.oauth2)throw Error('Google login is still loading. Try again.');localStorage.setItem('hb.cid',id);localStorage.setItem('hb.key',key);client=google.accounts.oauth2.initTokenClient({client_id:id,scope,callback:r=>{if(r.error){err(r.error_description||r.error);return}token=r.access_token;selected=false;ready();msg('Connected. Select the Hook & Book folder.');},error_callback:e=>err(e.type)});client.requestAccessToken({prompt:'select_account'});}catch(e){err(e)}};
$('logout').onclick=()=>{if(token)google.accounts.oauth2.revoke(token,()=>{});token='';selected=false;items=[];render();ready();msg('Disconnected.');};
$('pick').onclick=()=>{try{if(!window.gapi)throw Error('Google Picker is still loading.');gapi.load('picker',()=>{try{const v=new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true).setMimeTypes('application/vnd.google-apps.folder');new google.picker.PickerBuilder().addView(v).setOAuthToken(token).setDeveloperKey($('key').value.trim()).setAppId($('cid').value.trim().split('-')[0]).setOrigin(location.origin).setTitle('Select Hook & Book only').setCallback(async d=>{if(d.action!==google.picker.Action.PICKED)return;try{if(d.docs[0].id!==folder)throw Error('Please select the exact Hook & Book test folder, not another folder.');const f=await (await api(base+'/'+folder+'?fields=id,name,capabilities(canAddChildren)')).json();if(!f.capabilities?.canAddChildren)throw Error('This account cannot upload to the folder.');selected=true;ready();await load();}catch(e){err(e)}}).build().setVisible(true);}catch(e){err(e)}});}catch(e){err(e)}};
async function load(){if(!selected)return;busy=true;ready();try{let all=[],page='';do{const q=new URLSearchParams({q:`'${folder}' in parents and trashed = false and mimeType = 'application/pdf'`,fields:'nextPageToken,files(id,name,createdTime,description,md5Checksum,size,thumbnailLink)',pageSize:'100',orderBy:'createdTime desc'});if(page)q.set('pageToken',page);const d=await(await api(base+'?'+q)).json();all.push(...(d.files||[]));page=d.nextPageToken||'';}while(page);items=all;render();msg('Connected to Hook & Book. '+items.length+' visible patterns.');}catch(e){err(e)}finally{busy=false;ready()}}
function categories(f){try{return JSON.parse(f.description||'{}').categories||[]}catch{return []}}
function render(){urls.forEach(URL.revokeObjectURL);urls=[];const q=$('search').value.toLowerCase();const list=items.filter(f=>(f.name+' '+categories(f).join(' ')).toLowerCase().includes(q));$('count').textContent=list.length+' patterns';$('cards').replaceChildren();for(const f of list){const a=document.createElement('article'),c=document.createElement('div');c.className='cover placeholder';c.textContent='📖';a.append(c);const d=document.createElement('div');d.className='details';const h=document.createElement('h3');h.textContent=f.name.replace(/\.pdf$/i,'');d.append(h);const p=document.createElement('p');p.className='muted';p.textContent=categories(f).join(' · ');d.append(p);const b=document.createElement('button');b.textContent='Open PDF';b.onclick=()=>openPdf(f);d.append(b);a.append(d);$('cards').append(a);if(f.thumbnailLink){api(f.thumbnailLink).then(r=>r.blob()).then(blob=>{if(!c.isConnected)return;const u=URL.createObjectURL(blob);urls.push(u);const im=document.createElement('img');im.className='cover';im.alt='Pattern cover';im.src=u;c.replaceWith(im)}).catch(()=>{});}}}
$('search').oninput=render;$('refresh').onclick=load;$('view').onclick=()=>{const l=$('cards').classList.toggle('list');$('view').textContent=l?'Picture view':'List view';localStorage.setItem('hb.view',l?'list':'grid')};if(localStorage.getItem('hb.view')==='list'){$('cards').classList.add('list');$('view').textContent='Picture view'}
$('upload').onclick=async()=>{if(!selected||busy)return;const files=[...$('files').files];if(!files.length){msg('Choose at least one PDF first.');return}busy=true;ready();let ok=0,failed=[];for(const f of files){try{if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')throw Error('Not a PDF');const cats=[...new Set($('cat').value.split(',').map(s=>s.trim()).filter(Boolean))];const metadata={name:f.name,mimeType:'application/pdf',parents:[folder],description:JSON.stringify({categories:cats})};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));form.append('file',f);msg('Uploading '+f.name+'…');await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:form});ok++}catch(e){failed.push(f.name+': '+e.message)}}busy=false;ready();await load();msg('Uploaded '+ok+' of '+files.length+'.'+(failed.length?'\n'+failed.join('\n'):''));if(!failed.length)$('files').value='';};
async function openPdf(f){try{$('readstatus').textContent='Loading PDF…';$('reader').showModal();$('download').disabled=$('share').disabled=true;const blob=await(await api(base+'/'+encodeURIComponent(f.id)+'?alt=media')).blob();if(!$('reader').open)return;active=new File([blob],f.name,{type:'application/pdf'});activeUrl=URL.createObjectURL(active);$('frame').src=activeUrl;$('readstatus').textContent='';$('download').disabled=false;$('share').disabled=!navigator.canShare?.({files:[active]});}catch(e){$('readstatus').textContent=e.message}}$('close').onclick=()=>$('reader').close();$('reader').onclose=()=>{$('frame').src='about:blank';if(activeUrl)URL.revokeObjectURL(activeUrl);active=null;activeUrl=''};$('download').onclick=()=>{if(!active)return;const a=document.createElement('a');a.href=activeUrl;a.download=active.name;a.click()};$('share').onclick=async()=>{try{if(active)await navigator.share({files:[active]})}catch(e){if(e.name!=='AbortError')$('readstatus').textContent=e.message}};ready();
</script></body></html>
